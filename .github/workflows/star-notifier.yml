name: Star Notifier

on:
  watch:
    types: [started]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Create notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const starer = context.payload.sender.login;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New star from @${starer}`,
              body: `Thanks @${starer} for starring this repository!\n\nThis is an automated notification.`
            });
